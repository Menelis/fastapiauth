[project]
name = "fastapiauth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Menelisi Mthembu", email = "menelismthembu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "annotated-types>=0.8.0",
    "asyncpg>=0.31.0",
    "cffi>=2.1.1",
    "click>=8.5.0",
    "cryptography>=50.0.1",
    "databases>=0.9.0",
    "dnspython>=2.8.0",
    "ecdsa>=0.19.2",
    "exceptiongroup>=1.3.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "h11>=0.16.0",
    "idna>=3.19",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pyasn1>=0.6.4",
    "pycparser>=3.0",
    "pydantic>=2.13.5",
    "pydantic-core>=2.46.5",
    "pyjwt>=2.13.0",
    "python-decouple>=3.8",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rsa>=4.9.1",
    "six>=1.17.0",
    "sniffio>=1.3.1",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
fastapiauth = "fastapiauth:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
